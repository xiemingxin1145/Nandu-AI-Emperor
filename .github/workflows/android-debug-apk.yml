name: Build Nandu Debug APK

on:
  push:
    branches:
      - main
      - 'release/**'
      - test/art-asset-integration
      - fix/prologue-audio-timeline-20260820
  pull_request:
    branches:
      - main
      - test/art-asset-integration
      - fix/stab-005-video-player-compat
      - integration/v1.6.2-preacceptance
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew scripts/check_android_release_policy.sh scripts/prepare_android_video_assets.sh scripts/check_video_assets.sh

      - name: Enforce Android release version and stable debug signing
        run: ./scripts/check_android_release_policy.sh

      - name: Enforce project roadmap, P0 ownership and device acceptance gates
        run: python3 ./scripts/check_project_governance.py

      - name: Ensure ffmpeg/ffprobe for preacceptance, video preparation and QA
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Audit integrated court art, capital and formal video routes
        run: python3 ./scripts/check_v162_preacceptance.py

      - name: Prepare Android-compatible MP4s
        run: ./scripts/prepare_android_video_assets.sh

      - name: Validate packaged MP4 compatibility
        run: ./scripts/check_video_assets.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify every declared JVM unit test ran successfully
        run: python3 ./scripts/check_v162_preacceptance.py --test-results app/build/test-results/testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify stable debug signing certificate
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apkcert.txt
          ACTUAL=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+).*/\L\1/p' /tmp/apkcert.txt | head -1)
          EXPECTED='ec1b19d8ffe51983a1b33bbedc7724d9d441218b7edd6c6e2062cf97d3843875'
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::APK 签名指纹变化：$ACTUAL。升级包必须保持稳定签名。"; exit 1; }

      - name: Verify packaged court art, Yingtian image and all 51 silent H.264 videos
        run: python3 ./scripts/check_v162_preacceptance.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Android signing tools for reproducible RC repack
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p /tmp/nandu-signing-tools
          cp "$BUILD_TOOLS/apksigner" /tmp/nandu-signing-tools/
          cp "$BUILD_TOOLS/zipalign" /tmp/nandu-signing-tools/
          cp -R "$BUILD_TOOLS/lib" /tmp/nandu-signing-tools/
          if [ -d "$BUILD_TOOLS/lib64" ]; then cp -R "$BUILD_TOOLS/lib64" /tmp/nandu-signing-tools/; fi
          chmod +x /tmp/nandu-signing-tools/apksigner /tmp/nandu-signing-tools/zipalign

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nandu-v1.6.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: nandu-android-signing-tools
          path: /tmp/nandu-signing-tools
          if-no-files-found: error
          retention-days: 7
