name: Sync vetted CC0 audio

on:
  push:
    branches:
      - opensource-audio-framework-pass
    paths:
      - 'scripts/sync_vetted_open_audio.sh'
      - '.github/workflows/sync-open-audio.yml'
      - 'docs/OPEN_SOURCE_REFERENCES.md'
      - 'docs/THIRD_PARTY_AUDIO.md'
      - 'app/src/main/java/com/xiemingxin/nandu/agent/UtilityDecisionEngine.kt'
      - 'app/src/test/java/com/xiemingxin/nandu/agent/UtilityDecisionEngineTest.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure audio tools
        shell: bash
        run: |
          set -e
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          command -v unzip >/dev/null || { sudo apt-get update && sudo apt-get install -y unzip; }

      - name: Replace prompt audio with vetted CC0 assets
        shell: bash
        run: |
          chmod +x scripts/sync_vetted_open_audio.sh
          scripts/sync_vetted_open_audio.sh

      - name: Show resulting audio inventory
        shell: bash
        run: |
          echo '--- BGM ---'
          find app/src/main/assets/audio/bgm -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo '--- UI ---'
          find app/src/main/assets/audio/ui -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo '--- VOICE (must be empty) ---'
          find app/src/main/assets/audio/voice -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit vetted generated assets to branch
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/main/assets/audio
          if git diff --cached --quiet; then
            echo 'No audio asset changes to commit.'
          else
            git commit -m 'chore(audio): replace generated prompt clips with vetted CC0 assets [skip ci]'
            git push origin HEAD:opensource-audio-framework-pass
          fi

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: nandu-open-audio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
