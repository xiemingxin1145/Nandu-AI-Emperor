name: Android Build

on:
  push:
    branches:
      - main
      - 'release/**'
      - ai-palace-simulator-v1
      - feature/living-world-court-v1
      - integration/living-world-canon-recovery-v1
      - ci/living-world-canon-base
  pull_request:
    branches:
      - main
      - fix/prologue-audio-timeline-20260820
      - feature/living-world-court-v1
      - ci/living-world-canon-base
      - fix/stab-005-video-player-compat
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew ./scripts/check_android_release_policy.sh ./scripts/prepare_android_video_assets.sh ./scripts/check_video_assets.sh

      - name: Enforce Android release version and stable debug signing
        run: ./scripts/check_android_release_policy.sh

      - name: Audit integrated court art, capital and formal video routes
        run: python3 ./scripts/check_v162_preacceptance.py

      - name: Ensure ffmpeg/ffprobe for video preparation and QA
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Prepare Android-compatible MP4s
        run: ./scripts/prepare_android_video_assets.sh

      - name: Validate packaged MP4 compatibility
        run: ./scripts/check_video_assets.sh

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle_test_output.txt

      - name: Report failure details via commit comment (sandbox log-access workaround)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | \
            xargs -I{} sh -c 'echo "== {} =="; grep -B2 -A15 "<failure" "{}"' 2>/dev/null > /tmp/report.txt
          if [ ! -s /tmp/report.txt ]; then
            echo "(no JUnit <failure> found -- likely a compile/policy/video-QA error; tail below)" > /tmp/report.txt
            tail -c 50000 /tmp/gradle_test_output.txt >> /tmp/report.txt 2>/dev/null
          fi
          head -c 55000 /tmp/report.txt > /tmp/report_trunc.txt
          jq -n --rawfile report /tmp/report_trunc.txt --arg branch "${{ github.ref_name }}" \
            '{body: ("CI failure summary (branch: " + $branch + ")\n\n```\n" + $report + "\n```")}' > /tmp/payload.json
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --data @/tmp/payload.json

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify stable debug signing certificate
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apkcert.txt
          ACTUAL=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+).*/\L\1/p' /tmp/apkcert.txt | head -1)
          EXPECTED='ec1b19d8ffe51983a1b33bbedc7724d9d441218b7edd6c6e2062cf97d3843875'
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::APK 签名指纹变化：$ACTUAL。升级包必须保持稳定签名。"; exit 1; }

      - name: Verify packaged court art, Yingtian image and all 51 silent H.264 videos
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          python3 ./scripts/check_v162_preacceptance.py --apk "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nandu-v1.6.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
