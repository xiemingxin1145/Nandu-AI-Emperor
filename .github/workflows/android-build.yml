name: Android Build

on:
  push:
    branches:
      - main
      - ai-palace-simulator-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            cp /tmp/build.log build-error-latest.txt
            git config user.email "ci@bot.dev"
            git config user.name "CI Bot"
            git add build-error-latest.txt
            git diff --cached --quiet || git commit -m "ci: build error [skip ci]"
            git push --force-with-lease || git push
          fi
          exit $EXIT

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
