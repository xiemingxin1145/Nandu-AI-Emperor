name: Android Build

on:
  push:
    branches:
      - main
      - ai-palace-simulator-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Print failed test details from XML
          find app/build/test-results -name "*.xml" 2>/dev/null | xargs grep -l "failure" 2>/dev/null | while read f; do
            echo "=== FAILED TEST FILE: $f ==="
            cat "$f"
          done
          exit $EXIT_CODE

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
